name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/project_extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project_extracted"

      - name: Find Xcode Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project_extracted" \
            -maxdepth 8 \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No .xcodeproj found."
            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJECT_DIR" .xcodeproj)

          echo "Project: $PROJECT_DIR"
          echo "Scheme: $PROJECT_NAME"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Show Project Information
        shell: bash
        run: |
          xcodebuild -version

          xcodebuild \
            -project "$PROJECT_DIR" \
            -list

      - name: Build iPhone App
        shell: bash
        run: |
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT_DIR" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Find Built App
        shell: bash
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products" \
            -type d \
            -path "*Release-iphoneos/*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No iPhone .app found."
            echo "Available build products:"
            find "$GITHUB_WORKSPACE/DerivedData/Build/Products" \
              -maxdepth 4 \
              -print
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/AttributionTestApp-unsigned.ipa" \
            Payload

          echo "Created:"
          ls -lh "$GITHUB_WORKSPACE/AttributionTestApp-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AttributionTestApp-unsigned
          path: AttributionTestApp-unsigned.ipa
