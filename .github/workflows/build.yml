name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/project_extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project_extracted"

      - name: Find Xcode Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project_extracted" \
            -maxdepth 8 \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No .xcodeproj found."
            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJECT_DIR" .xcodeproj)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"
          echo "Scheme: $PROJECT_NAME"

      - name: Build for Real Device
        shell: bash
        run: |
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT_DIR" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            clean build

      - name: Package to IPA
        shell: bash
        run: |
          set -e

          echo "Build directory contents:"
          find "$GITHUB_WORKSPACE/build" -maxdepth 3 -print

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found."
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          zip -qry \
            AttributionTestApp-unsigned.ipa \
            Payload

          echo "IPA created successfully:"
          ls -lh AttributionTestApp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttributionTestApp-unsigned
          path: AttributionTestApp-unsigned.ipa
