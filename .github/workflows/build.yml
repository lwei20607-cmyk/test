- name: Build for Real Device (Ad-Hoc Sign)
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT_DIR" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            VALIDATE_PRODUCT=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "xcodebuild exit code: $BUILD_STATUS"
          echo ""

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Build failed and no .app was generated."
            echo ""
            echo "========== XCODE ERRORS =========="
            grep -iE "error:|fatal error|BUILD FAILED" \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -100 || true
            exit 1
          fi

          echo "APP successfully generated:"
          echo "$APP_PATH"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "WARNING: xcodebuild returned $BUILD_STATUS,"
            echo "but the iPhone .app exists, so packaging will continue."
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          exit 0
